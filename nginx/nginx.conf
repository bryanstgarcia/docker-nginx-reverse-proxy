# Configuración global
worker_processes auto;
events {
    worker_connections 1024;
}

http {
    # Limitar la tasa de solicitudes para proteger contra DDoS
    limit_req_zone $binary_remote_addr zone=mylimit:10m rate=10r/s;
    # Removes NGINX version/info in request
    server_tokens off;
    # Adds mime types to be able to serve css and others
    include       mime.types;
    default_type  application/octet-stream;
    # Security configuration
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains";
    #add_header Content-Security-Policy "default-src 'self';";
    #add_header Content-Security-Policy "default-src *;";
    add_header X-Content-Type-Options "nosniff";
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";

    # SSL Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # IMPORTANT: UPDATE Catch all request from not registered server_name
    # HELPS IGNORE NOT AUTHORIZED REQUEST TO THE SERVER 
    # CREATE MANUALLY THE SELFSIGNED IN LOCAL, CREATE THE VOLUME AND PUSH. 
    #server {
    #    listen 80 default_server;  # This will catch all requests with invalid domains
    #    server_name _;  # The underscore means it will match any invalid or unspecified domain
    #
    #    return 404;  # Return a 404 for all invalid requests
    #}
    #server {
    #    listen 443 ssl  default_server;  # This will catch all requests with invalid domains
    #    server_name _;  # The underscore means it will match any invalid or unspecified domain
    #    ssl_certificate /etc/nginx/ssl/self-signed.crt;
    #    ssl_certificate_key /etc/nginx/ssl/self-signed.key;
    #    return 404;  # Return a 404 for all invalid requests
    #}

    server {
        listen [::]:80;
        listen 80;

        # Configura la URL del dominio que va a recibir la solicitud
        server_name *.devcorner.top;
        
        # Permitir solo tráfico desde Cloudflare
        allow 173.245.48.0/20;
        allow 103.21.244.0/22;
        allow 103.22.200.0/22;
        allow 103.31.4.0/22;
        allow 141.101.64.0/18;
        allow 108.162.192.0/18;
        allow 190.93.240.0/20;
        allow 188.114.96.0/20;
        allow 197.234.240.0/22;
        allow 198.41.128.0/17;
        allow 162.158.0.0/15;
        allow 104.16.0.0/13;
        allow 104.24.0.0/14;
        allow 172.64.0.0/13;
        allow 131.0.72.0/22;

        # Si quieres incluir IPv6 también:
        allow 2400:cb00::/32;
        allow 2606:4700::/32;
        allow 2803:f800::/32;
        allow 2405:b500::/32;
        allow 2405:8100::/32;
        allow 2a06:98c0::/29;
        allow 2c0f:f248::/32;

        # Bloquear todo lo demás
        deny all;

        #Letsncrypt cetbot challenge
        location ~ /.well-known/acme-challenge/ {
            allow all;
            root /var/www/certbot;
        }
        # Redirects from http to https
        return 301 https://$host$request_uri;

    }

    server {
        # Listen HTTPS
        listen 443 ssl;
        http2 on;
        server_name *.devcorner.top;

        # Permitir solo tráfico desde Cloudflare
        allow 173.245.48.0/20;
        allow 103.21.244.0/22;
        allow 103.22.200.0/22;
        allow 103.31.4.0/22;
        allow 141.101.64.0/18;
        allow 108.162.192.0/18;
        allow 190.93.240.0/20;
        allow 188.114.96.0/20;
        allow 197.234.240.0/22;
        allow 198.41.128.0/17;
        allow 162.158.0.0/15;
        allow 104.16.0.0/13;
        allow 104.24.0.0/14;
        allow 172.64.0.0/13;
        allow 131.0.72.0/22;

        # Cloudflare IPv6:
        allow 2400:cb00::/32;
        allow 2606:4700::/32;
        allow 2803:f800::/32;
        allow 2405:b500::/32;
        allow 2405:8100::/32;
        allow 2a06:98c0::/29;
        allow 2c0f:f248::/32;

        # Bloquear todo lo demás
        deny all;

        # SSL config
        ssl_certificate /etc/letsencrypt/live/devcorner.top/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/devcorner.top/privkey.pem;

        # Block requests with dangerous URL patterns (e.g., PHP unit and .env)
        location ~* "/(eval-stdin|phpunit|allow_url_include|\.env|\.git|\.svn|\.htaccess)" {
            return 403;  # Return Forbidden for matching requests
        }

        # Deny access to sensitive files like .env or configuration files
        location ~* "\.(env|git|svn|htaccess|log|sql|bak)$" {
            deny all;
            return 403;
        }


        # Prevent access to .git, .gitignore, or other sensitive repository files
        location ~ /\.git {
            deny all;
            return 403;
        }

        location / {
            # Block specific query parameters commonly used for exploitation (e.g., eval, php://input)
            #set $block_eval 0;
            #
            #if ($query_string ~* "allow_url_include|eval|php://input|md5|base64_encode|exec|system") {
            #    set $block_eval 1;
            #}
            #
            #if ($block_eval) {
            #    return 403;  # Forbidden access to potentially malicious requests
            #}
            limit_req zone=mylimit burst=10;

            proxy_pass http://cms-strapi-production:1337/;
            proxy_http_version 1.1;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Server $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_pass_request_headers on;
        }

        location /main/css/ {
            alias /usr/share/nginx/main/;
        }
    }

    server {
        listen 2000;
        server_name mainserver;

        location / {
            root /usr/share/nginx/main/;
            try_files $uri $uri/ =404;
        }
    }

}

