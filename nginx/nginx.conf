# Configuración global
worker_processes auto;
events {
    worker_connections 1024;
}

http {
    # Limitar la tasa de solicitudes para proteger contra DDoS
    limit_req_zone $binary_remote_addr zone=mylimit:10m rate=10r/s;
    # Removes NGINX version/info in request
    server_tokens off;
    # Adds mime types to be able to serve css and others
    include       mime.types;
    default_type  application/octet-stream;
    # Security configuration
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains";
    #add_header Content-Security-Policy "default-src 'self';";
    #add_header Content-Security-Policy "default-src *;";
    add_header X-Content-Type-Options "nosniff";
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";

    # SSL Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # Catch all request from not registered server_name
    server {
        listen 80 default_server;  # This will catch all requests with invalid domains
        server_name _;  # The underscore means it will match any invalid or unspecified domain

        return 404;  # Return a 404 for all invalid requests
    }

    server {
        listen 443 ssl default_server;  # This will catch all requests with invalid domains
        server_name _;  # The underscore means it will match any invalid or unspecified domain

        return 404;  # Return a 404 for all invalid requests
    }

    server {
        listen [::]:80;
        listen 80;

        # Configura la URL del dominio que va a recibir la solicitud
        server_name api.devcorner.top www.api.devcorner.top;
        
        #Letsncrypt cetbot challenge
        location ~ /.well-known/acme-challenge/ {
            allow all;
            root /var/www/certbot;
        }
        # Redirects from http to https
        #return 301 https://$host$request_uri;

    }

